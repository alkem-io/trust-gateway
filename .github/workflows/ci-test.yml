name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    uses: alkem-io/github-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      run-vet: true
      setup-script: .scripts/ci/setup-cleverbase-ffi.sh
      coverage-min: 95

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build Kubernetes base
        # ubuntu-latest provides kubectl; the base has no network-fetched dependencies.
        run: kubectl kustomize deploy/k8s/base >/dev/null
