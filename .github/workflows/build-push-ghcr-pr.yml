name: Build & Push Container (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-image-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  image:
    uses: alkem-io/github-workflows/.github/workflows/container-pr.yml@v1
    permissions:
      contents: read
      packages: write
      pull-requests: write

  blackbox:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run credential-free black-box signing
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          TRUST_GATEWAY_IMAGE="ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-${IMAGE_SHA:0:7}" \
            .scripts/ci/standalone-e2e.sh
      - name: Run Cleverbase public-stub contract journey
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          TRUST_GATEWAY_E2E_MODE=stub \
          TRUST_GATEWAY_IMAGE="ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}-${IMAGE_SHA:0:7}" \
            .scripts/ci/standalone-e2e.sh
